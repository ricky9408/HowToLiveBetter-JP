name: 内容や動作の修正
description: 日本版の誤記、制度の変更、表示や生成の不具合を報告する
title: "[修正] "
body:
  - type: textarea
    id: location
    attributes:
      label: 該当する場所
      description: 章・項目、ファイル、画面の操作手順を記載してください。
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 問題と修正案
      description: 現在の説明、正しい説明、適用条件を記載してください。個人情報は記載しないでください。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 確認できる資料
      description: 制度の修正は公式リンク、確認日、該当箇所を添えてください。
