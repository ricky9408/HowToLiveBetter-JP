# 週1回、出典の失効を確認する。404、410、存在しないDOIは失敗として報告する。
name: 出典リンクの定期確認

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: 出典リンクの確認
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check-links.mjs
