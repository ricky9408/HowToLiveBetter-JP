# 本文を検査してから日本語版の4形式を生成する。検査失敗時は公開しない。
name: 日本語版電子書籍

on:
  push:
    branches: [main]
    paths: [README.md, index.html, selfcheck.html, og.png, 'book/**', 'docs/**', 'tools/**', '.github/workflows/**']
  pull_request:
    paths: [README.md, index.html, selfcheck.html, og.png, 'book/**', 'docs/**', 'tools/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handbook-jp-${{ github.ref }}
  # 公開を含むmainの実行は途中で中止しない。PRの検査は新しい版を優先する。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  validate:
    name: 本文と出典の検査
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: PDF本文の検証器
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: 解析処理のテスト
        run: node --test tools/test/*.test.mjs
      - name: 必須欄・費用タグ・内部参照
        run: node tools/check-refs.mjs --check
      - name: 要点の読みやすさ
        run: node tools/check-plain.mjs
      - name: 書き出し時の本文保持
        run: node tools/check-split.mjs
      - name: 統計と本文の一致
        run: node tools/sync-stats.mjs --check
      - name: 出典リンクの失効確認
        run: node tools/check-links.mjs

  build:
    name: 電子書籍の生成と公開
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json
      - name: EPUB用の依存関係
        run: npm ci
        working-directory: tools/epub
      - name: EPUB・オフラインHTML・Ankiの生成
        run: |
          node tools/epub/build.mjs
          node tools/offline/build.mjs
          node tools/anki/build.mjs
      - name: PDF用ツールと日本語フォント
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils
          task_tools_dir="$RUNNER_TEMP/handbook-jp-tools"
          mkdir -p "$task_tools_dir"
          curl --fail --location --retry 3 -o "$task_tools_dir/pandoc.tar.gz" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          tar xzf "$task_tools_dir/pandoc.tar.gz" -C "$task_tools_dir"
          curl --fail --location --retry 3 -o "$task_tools_dir/typst.tar.xz" "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar xJf "$task_tools_dir/typst.tar.xz" -C "$task_tools_dir"
          echo "$task_tools_dir/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$task_tools_dir/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: PDFの生成
        run: node tools/pdf/build.mjs
      - name: 生成物と本文の照合
        run: node tools/check-exports.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: EPUB形式の検証
        run: |
          task_tools_dir="$RUNNER_TEMP/handbook-jp-tools"
          mkdir -p "$task_tools_dir"
          curl --fail --location --retry 3 -o "$task_tools_dir/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q -o "$task_tools_dir/epubcheck.zip" -d "$task_tools_dir"
          java -jar "$task_tools_dir/epubcheck-5.4.0/epubcheck.jar" dist/HowToLiveBetter-JP.epub
      - uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter-JP
          path: |
            dist/HowToLiveBetter-JP.epub
            dist/HowToLiveBetter-JP.pdf
            dist/HowToLiveBetter-JP.html
            dist/HowToLiveBetter-JP.apkg
  publish:
    name: 検証済みのmainを公開
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # 固定の配布先への書込みは、ブランチとは別に直列実行する。
    concurrency:
      group: handbook-jp-epub-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HowToLiveBetter-JP
          path: dist
      - name: 検証済みの電子書籍をReleaseへ公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_release_notes="$RUNNER_TEMP/handbook-jp-release.md"
          cat > "$task_release_notes" <<EOF
          本文の版：[${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA})
          生成日時：$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')（日本時間）
          EPUB、PDF、オフラインHTML、Ankiの日本語版です。すべての検査とEPUB形式の検証に成功した版を公開します。

          生成元のソース：[このコミットのZIP](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.zip)。
          epub-latestは固定の配布先です。既存のタグは移動しないため、GitHubが表示するタグのソースアーカイブと本文の版が異なる場合があります。生成元は上記のコミットとZIPを確認してください。
          EOF
          if gh release view epub-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit epub-latest --repo "$GITHUB_REPOSITORY" --title "日本語版電子書籍（自動更新）" --notes-file "$task_release_notes"
          else
            gh release create epub-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "日本語版電子書籍（自動更新）" --notes-file "$task_release_notes" --latest=false
          fi
          gh release upload epub-latest --repo "$GITHUB_REPOSITORY" dist/HowToLiveBetter-JP.epub dist/HowToLiveBetter-JP.pdf dist/HowToLiveBetter-JP.html dist/HowToLiveBetter-JP.apkg --clobber
